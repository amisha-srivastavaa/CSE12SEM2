<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <meta name="description" content="Beautiful weather dashboard with interactive animated sky, clouds, stars, and real-time forecasts.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            color: #fff;
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0b1a3b;
        }

        /* ---- CANVAS ---- */
        #skyCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* ---- GLASS PANELS ---- */
        .glass {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: var(--radius);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: var(--radius);
            color: var(--text-dark);
        }

        /* day mode overrides */
        body.day-mode .glass {
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--text-dark);
        }
        body.day-mode .glass .condition-row,
        body.day-mode .glass .metric-label,
        body.day-mode .glass .forecast-label,
        body.day-mode .glass .hourly-time,
        body.day-mode .glass .daily-icon,
        body.day-mode .glass .daily-lo { color: var(--text-muted); }
        body.day-mode .glass .unit-btn { color: var(--text-muted); }
        body.day-mode .glass .unit-btn.active { background: var(--text-dark); color: #fff; }

        /* ---- APP SHELL ---- */
        .app-shell {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 28px 24px 48px;
        }

        /* ---- TOP BAR ---- */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .back-link {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.8rem;
            margin-right: auto;
            white-space: nowrap;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }
        body.day-mode .back-link { color: var(--text-muted); }
        body.day-mode .back-link:hover { color: var(--text-dark); }

        .search-area {
            flex: 1;
            position: relative;
            max-width: 460px;
        }

        .search-row { display: flex; overflow: hidden; }

        .search-row input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: var(--font);
            color: inherit;
            outline: none;
        }
        .search-row input::placeholder { color: rgba(255,255,255,0.45); }
        body.day-mode .search-row input { color: var(--text-dark); }
        body.day-mode .search-row input::placeholder { color: var(--text-muted); }

        .search-row button {
            background: transparent;
            border: none;
            border-left: 1px solid rgba(255,255,255,0.15);
            padding: 0 16px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .search-row button:hover { color: #fff; }
        body.day-mode .search-row button { color: var(--text-muted); border-color: rgba(0,0,0,0.1); }

        .geo-btn {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            font-size: 1rem;
            flex-shrink: 0;
            transition: color 0.2s, border-color 0.2s;
        }
        .geo-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
        body.day-mode .geo-btn { color: var(--text-muted); }

        /* Recent dropdown */
        .recent-list {
            list-style: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0; width: 100%;
            z-index: 20;
            overflow: hidden;
        }
        .recent-list li {
            padding: 10px 16px;
            font-size: 0.88rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            transition: background 0.15s;
        }
        .recent-list li:last-child { border-bottom: none; }
        .recent-list li:hover { background: rgba(255,255,255,0.15); }

        .status-msg { text-align: center; font-size: 0.85rem; margin-top: 6px; }
        .status-msg.error { color: #fca5a5; }
        body.day-mode .status-msg.error { color: #b91c1c; }
        .status-msg.loading { color: rgba(255,255,255,0.6); }
        .hidden { display: none !important; }

        /* ---- WEATHER GRID ---- */
        .weather-grid {
            display: grid;
            grid-template-columns: 38% 62%;
            gap: 20px;
            align-items: start;
        }

        /* Left panel */
        .left-panel { display: flex; flex-direction: column; padding: 24px; }

        .city-name { font-size: 1.45rem; font-weight: 600; margin-bottom: 4px; }

        .condition-row {
            display: flex; align-items: center; gap: 8px;
            color: rgba(255,255,255,0.6);
            font-size: 1.05rem;
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        .condition-row i { font-size: 1.1rem; }

        .big-temp { font-size: 5rem; font-weight: 300; line-height: 1; letter-spacing: -2px; }
        .big-unit { font-size: 1.6rem; font-weight: 400; color: rgba(255,255,255,0.5); vertical-align: top; letter-spacing: 0; }
        body.day-mode .big-unit { color: var(--text-muted); }

        .unit-toggle {
            display: inline-flex;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
            margin: 16px 0 28px;
            background: rgba(255,255,255,0.08);
        }
        body.day-mode .unit-toggle { border-color: rgba(0,0,0,0.12); background: rgba(0,0,0,0.04); }

        .unit-btn {
            background: transparent; border: none;
            padding: 6px 14px; font-size: 0.85rem;
            font-family: var(--font); cursor: pointer;
            color: rgba(255,255,255,0.5);
            transition: background 0.2s, color 0.2s;
        }
        .unit-btn.active { background: #fff; color: #1e293b; border-radius: 6px; }
        .unit-btn:not(.active):hover { background: rgba(255,255,255,0.1); }

        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .metric { display: flex; flex-direction: column; border-left: 2px solid rgba(255,255,255,0.15); padding-left: 10px; }
        body.day-mode .metric { border-color: rgba(0,0,0,0.1); }
        .metric-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.45); margin-bottom: 2px; font-weight: 500; }
        .metric-val { font-size: 1.05rem; font-weight: 500; }

        /* Right panel */
        .right-panel { display: flex; flex-direction: column; gap: 20px; }
        .forecast-card { padding: 24px; }
        .forecast-label {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
            color: rgba(255,255,255,0.4); font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px; margin-bottom: 14px;
        }

        .hourly-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
        .hourly-scroll::-webkit-scrollbar { height: 3px; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .hourly-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 56px; flex-shrink: 0; }
        .hourly-time { font-size: 0.8rem; color: rgba(255,255,255,0.5); font-weight: 500; }
        .hourly-icon { font-size: 1.15rem; }
        .hourly-temp { font-size: 0.95rem; font-weight: 500; }

        .daily-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .daily-row:last-child { border-bottom: none; }
        .daily-day { flex: 1; font-weight: 500; font-size: 0.92rem; }
        .daily-icon { flex: 0 0 36px; text-align: center; font-size: 1rem; color: rgba(255,255,255,0.5); }
        .daily-temps { flex: 1; text-align: right; font-size: 0.92rem; }
        .daily-hi { font-weight: 600; margin-right: 6px; }
        .daily-lo { color: rgba(255,255,255,0.4); }

        @media (max-width: 768px) {
            .weather-grid { grid-template-columns: 1fr; }
            .top-bar { flex-wrap: wrap; }
            .search-area { max-width: none; }
            .left-panel { padding: 20px; }
            .forecast-card { padding: 18px; }
            .big-temp { font-size: 3.8rem; }
            .back-link { width: 100%; margin-bottom: 6px; }
        }
    </style>
</head>
<body>

    <canvas id="skyCanvas"></canvas>

    <div class="app-shell">
        <div class="top-bar">
            <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Projects</a>
            <div class="search-area glass search-row" id="searchArea">
                <form id="searchForm" style="display:contents;">
                    <input type="text" id="cityInput" placeholder="Search any city..." autocomplete="off" required>
                    <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
                <ul id="recentList" class="recent-list glass hidden"></ul>
            </div>
            <button class="geo-btn glass" id="geoBtn" title="Use my location"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>

        <div id="statusMsg" class="status-msg hidden"></div>

        <div id="weatherGrid" class="weather-grid hidden">
            <div class="left-panel glass">
                <h1 class="city-name" id="cityName">--</h1>
                <div class="condition-row">
                    <i id="condIcon" class="fa-solid fa-cloud"></i>
                    <span id="condText">--</span>
                </div>
                <div>
                    <span class="big-temp" id="bigTemp">--</span>
                    <span class="big-unit" id="bigUnit">&deg;C</span>
                </div>
                <div class="unit-toggle">
                    <button class="unit-btn active" data-unit="c">&deg;C</button>
                    <button class="unit-btn" data-unit="f">&deg;F</button>
                </div>
                <div class="metrics">
                    <div class="metric"><span class="metric-label">Feels like</span><span class="metric-val" id="feelsLike">--</span></div>
                    <div class="metric"><span class="metric-label">Humidity</span><span class="metric-val" id="humidity">--</span></div>
                    <div class="metric"><span class="metric-label">Wind</span><span class="metric-val" id="wind">--</span></div>
                    <div class="metric"><span class="metric-label">Pressure</span><span class="metric-val" id="pressure">--</span></div>
                </div>
            </div>
            <div class="right-panel">
                <div class="forecast-card glass">
                    <div class="forecast-label">Hourly Forecast</div>
                    <div class="hourly-scroll" id="hourlyScroll"></div>
                </div>
                <div class="forecast-card glass">
                    <div class="forecast-label">5-Day Forecast</div>
                    <div id="dailyList"></div>
                </div>
            </div>
        </div>
    </div>

<script>
// ============================================================
//  BEAUTIFUL ANIMATED SKY WEATHER DASHBOARD
//  Features: layered sky gradients, fluffy animated clouds,
//  twinkling stars, rain/snow/lightning, mouse interaction,
//  and real weather data from Open-Meteo (no API key needed).
// ============================================================

const canvas = document.getElementById('skyCanvas');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

// ---- State ----
let unit = 'c';
let rawData = null;
let currentCondition = 'clouds';
let isDay = 1;
let mouse = { x: -9999, y: -9999 };
let tabVisible = true;

// ---- Particle arrays (declared early to avoid TDZ errors) ----
let stars = [];
let clouds = [];
let rainDrops = [];
let snowflakes = [];
let shootingStars = [];
let flashBright = 0;
let nextFlash = Date.now() + 3000;
let celestialAngle = 0;
let currentSky = ['#64748b', '#94a3b8', '#cbd5e1'];
let targetSky = ['#64748b', '#94a3b8', '#cbd5e1'];
let skyLerp = 1;

document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
document.addEventListener('visibilitychange', () => { tabVisible = !document.hidden; });


// ============================================================
//  SKY RENDERING — Gradient backgrounds
// ============================================================

// Sky color palettes: [top, middle, bottom]
const skyColors = {
    clear_day:    ['#2563eb', '#60a5fa', '#fcd34d'],
    clear_night:  ['#0f172a', '#1e1b4b', '#312e81'],
    clouds_day:   ['#64748b', '#94a3b8', '#cbd5e1'],
    clouds_night: ['#1e293b', '#334155', '#475569'],
    rain_day:     ['#475569', '#64748b', '#94a3b8'],
    rain_night:   ['#0f172a', '#1e293b', '#334155'],
    snow_day:     ['#e0e7ff', '#c7d2fe', '#ddd6fe'],
    snow_night:   ['#1e1b4b', '#312e81', '#3730a3'],
    thunder_day:  ['#1e293b', '#334155', '#475569'],
    thunder_night:['#0c0a1a', '#1a1333', '#261d4d'],
};

currentSky = skyColors.clouds_day;
targetSky = skyColors.clouds_day;
skyLerp = 1;

function lerpColor(a, b, t) {
    // Parse hex to RGB, lerp, return hex
    const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
    const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const bl = Math.round(ab + (bb - ab) * t);
    return `rgb(${r},${g},${bl})`;
}

function drawSky() {
    let top, mid, bot;
    if (skyLerp >= 1) {
        [top, mid, bot] = currentSky;
    } else {
        top = lerpColor(currentSky[0], targetSky[0], skyLerp);
        mid = lerpColor(currentSky[1], targetSky[1], skyLerp);
        bot = lerpColor(currentSky[2], targetSky[2], skyLerp);
    }
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, top);
    grad.addColorStop(0.55, mid);
    grad.addColorStop(1, bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function setSky(condition, dayFlag) {
    const key = condition + (dayFlag ? '_day' : '_night');
    const newSky = skyColors[key] || skyColors.clouds_day;
    if (newSky === targetSky) return;
    currentSky = targetSky.map((c, i) => {
        if (skyLerp >= 1) return c;
        return lerpColor(currentSky[i], targetSky[i], skyLerp);
    });
    if (currentSky[0].startsWith('#')) { /* already hex, fine */ }
    targetSky = newSky;
    skyLerp = 0;

    // Update body class for glass panel colors
    document.body.className = dayFlag ? 'day-mode' : '';
}


// ============================================================
//  STARS — twinkling dots across the sky (visible at night)
// ============================================================

// stars array declared at top of script

function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 3000);
    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height * 0.7,
            r: 0.3 + Math.random() * 1.8,
            phase: Math.random() * Math.PI * 2,
            speed: 0.008 + Math.random() * 0.025,
            baseOpacity: 0.3 + Math.random() * 0.7,
        });
    }
}

function drawStars() {
    // Stars are only visible at night
    const nightFactor = isDay ? 0 : 1;
    if (nightFactor === 0) return;

    for (const s of stars) {
        s.phase += s.speed;
        const twinkle = 0.4 + 0.6 * Math.sin(s.phase);
        const opacity = s.baseOpacity * twinkle * nightFactor;

        // Outer glow
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
        glow.addColorStop(0, `rgba(200, 220, 255, ${opacity * 0.3})`);
        glow.addColorStop(1, 'rgba(200, 220, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fill();

        // Bright core
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240, 248, 255, ${opacity})`;
        ctx.fill();
    }
}


// ============================================================
//  CLOUDS — big, fluffy, layered cloud shapes
//  Multiple overlapping circles create realistic cloud forms.
//  They drift across the sky and gently push away from mouse.
// ============================================================

// clouds array declared at top of script

function createCloud(forceX) {
    const w = canvas.width;
    const h = canvas.height;
    const baseSize = 50 + Math.random() * 100;
    const y = Math.random() * h * 0.55 + h * 0.05;
    const speed = 0.15 + Math.random() * 0.45;
    const opacity = 0.25 + Math.random() * 0.45;
    const x = forceX !== undefined ? forceX : Math.random() * (w + 400) - 200;

    // Each cloud is made of 5-8 overlapping circles for a fluffy shape
    const puffs = [];
    const puffCount = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < puffCount; i++) {
        puffs.push({
            ox: (i - puffCount/2) * baseSize * 0.55 + (Math.random() - 0.5) * baseSize * 0.3,
            oy: (Math.random() - 0.5) * baseSize * 0.5,
            r: baseSize * (0.5 + Math.random() * 0.5),
        });
    }

    return { x, y, speed, opacity, puffs, baseSize };
}

function initClouds() {
    clouds = [];
    for (let i = 0; i < 12; i++) {
        clouds.push(createCloud());
    }
    // Sort by opacity for depth layering (farther clouds dimmer)
    clouds.sort((a, b) => a.opacity - b.opacity);
}

function drawClouds() {
    for (const c of clouds) {
        c.x += c.speed;

        // Mouse repulsion — clouds drift away from cursor
        const dx = c.x - mouse.x;
        const dy = c.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 250 && dist > 1) {
            const force = ((250 - dist) / 250) * 0.6;
            c.x += (dx / dist) * force;
            c.y += (dy / dist) * force * 0.3;
        }

        // Reset when off right edge
        if (c.x > canvas.width + c.baseSize * 4) {
            c.x = -c.baseSize * 4;
            c.y = Math.random() * canvas.height * 0.55 + canvas.height * 0.05;
        }

        // Draw fluffy puffs
        const dayAlpha = isDay ? 1 : 0.35;
        for (const p of c.puffs) {
            const px = c.x + p.ox;
            const py = c.y + p.oy;
            const grad = ctx.createRadialGradient(px, py, p.r * 0.1, px, py, p.r);
            const baseColor = isDay ? '255,255,255' : '180,190,210';
            grad.addColorStop(0, `rgba(${baseColor}, ${c.opacity * dayAlpha})`);
            grad.addColorStop(0.6, `rgba(${baseColor}, ${c.opacity * 0.4 * dayAlpha})`);
            grad.addColorStop(1, `rgba(${baseColor}, 0)`);
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
        }
    }
}

initClouds();


// ============================================================
//  SUN / MOON — celestial body in the sky
// ============================================================

// celestialAngle declared at top of script

function drawCelestial() {
    celestialAngle += 0.0008;
    const cx = canvas.width - 140;
    const cy = 120;

    if (isDay) {
        // SUN — warm glowing orb with light rays
        // Outer glow
        const outerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 180);
        outerGlow.addColorStop(0, 'rgba(255, 220, 100, 0.3)');
        outerGlow.addColorStop(0.5, 'rgba(255, 200, 50, 0.08)');
        outerGlow.addColorStop(1, 'rgba(255, 200, 50, 0)');
        ctx.beginPath();
        ctx.arc(cx, cy, 180, 0, Math.PI * 2);
        ctx.fillStyle = outerGlow;
        ctx.fill();

        // Light rays
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(celestialAngle);
        for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2;
            const len = 130 + Math.sin(celestialAngle * 3 + i * 0.7) * 30;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
            ctx.lineTo(Math.cos(a + 0.08) * len * 0.9, Math.sin(a + 0.08) * len * 0.9);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 230, 140, 0.06)';
            ctx.fill();
        }
        ctx.restore();

        // Sun disc
        const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 45);
        sunGrad.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
        sunGrad.addColorStop(0.7, 'rgba(255, 220, 100, 0.7)');
        sunGrad.addColorStop(1, 'rgba(255, 200, 50, 0.2)');
        ctx.beginPath();
        ctx.arc(cx, cy, 45, 0, Math.PI * 2);
        ctx.fillStyle = sunGrad;
        ctx.fill();
    } else {
        // MOON — pale silver crescent
        const moonGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
        moonGlow.addColorStop(0, 'rgba(200, 210, 240, 0.15)');
        moonGlow.addColorStop(1, 'rgba(200, 210, 240, 0)');
        ctx.beginPath();
        ctx.arc(cx, cy, 120, 0, Math.PI * 2);
        ctx.fillStyle = moonGlow;
        ctx.fill();

        // Moon disc
        ctx.beginPath();
        ctx.arc(cx, cy, 35, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(220, 230, 250, 0.9)';
        ctx.fill();

        // Crescent shadow
        ctx.beginPath();
        ctx.arc(cx + 12, cy - 8, 30, 0, Math.PI * 2);
        ctx.fillStyle = lerpColor(currentSky[0] || '#0f172a', '#0f172a', 0.5);
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}


// ============================================================
//  RAIN PARTICLES — streaks that push away from cursor
// ============================================================

// rainDrops array declared at top of script

function initRain() {
    rainDrops = [];
    for (let i = 0; i < 200; i++) {
        rainDrops.push({
            x: Math.random() * (canvas.width + 200) - 100,
            y: Math.random() * canvas.height,
            vx: -1.5 - Math.random() * 1.5,
            vy: 10 + Math.random() * 8,
            len: 12 + Math.random() * 22,
            w: 0.8 + Math.random() * 1.2,
            opacity: 0.12 + Math.random() * 0.25,
        });
    }
}

function drawRain() {
    if (currentCondition !== 'rain' && currentCondition !== 'thunder') return;
    for (const d of rainDrops) {
        // Mouse repulsion
        const dx = d.x - mouse.x, dy = d.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120 && dist > 0) d.x += (dx / dist) * ((120 - dist) / 120) * 4;

        d.x += d.vx;
        d.y += d.vy;
        if (d.y > canvas.height + 30) { d.y = -20 - Math.random() * 100; d.x = Math.random() * (canvas.width + 200) - 100; }

        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.vx * 2, d.y + d.len);
        ctx.strokeStyle = `rgba(180, 210, 240, ${d.opacity})`;
        ctx.lineWidth = d.w;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
}


// ============================================================
//  SNOW PARTICLES — drifting flakes attracted to cursor
// ============================================================

// snowflakes array declared at top of script

function initSnow() {
    snowflakes = [];
    for (let i = 0; i < 150; i++) {
        snowflakes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: -0.3 + Math.random() * 0.6,
            vy: 0.4 + Math.random() * 1.5,
            r: 1.5 + Math.random() * 4,
            opacity: 0.4 + Math.random() * 0.5,
            phase: Math.random() * Math.PI * 2,
            drift: 0.01 + Math.random() * 0.02,
        });
    }
}

function drawSnow() {
    if (currentCondition !== 'snow') return;
    for (const s of snowflakes) {
        s.phase += s.drift;
        s.x += s.vx + Math.sin(s.phase) * 0.5;
        s.y += s.vy;

        // Mouse attraction
        const dx = mouse.x - s.x, dy = mouse.y - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 150 && dist > 1) {
            const f = ((150 - dist) / 150) * 0.8;
            s.x += (dx / dist) * f;
            s.y += (dy / dist) * f;
        }

        if (s.y > canvas.height + 10) { s.y = -5; s.x = Math.random() * canvas.width; }

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
        ctx.fill();
    }
}


// ============================================================
//  LIGHTNING — bright flashes for thunderstorms
// ============================================================

// flashBright and nextFlash declared at top of script

function drawLightning() {
    if (currentCondition !== 'thunder') { flashBright = 0; return; }
    if (Date.now() > nextFlash) {
        flashBright = 0.6 + Math.random() * 0.4;
        nextFlash = Date.now() + 4000 + Math.random() * 6000;
    }
    if (flashBright > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashBright})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashBright *= 0.8;
        if (flashBright < 0.01) flashBright = 0;
    }
}


// ============================================================
//  SHOOTING STARS — occasional streaks across night sky
// ============================================================

// shootingStars declared at top of script
let nextShootingStar = Date.now() + 5000;

function drawShootingStars() {
    if (isDay) return;
    const now = Date.now();
    if (now > nextShootingStar) {
        shootingStars.push({
            x: Math.random() * canvas.width * 0.7,
            y: Math.random() * canvas.height * 0.3,
            vx: 6 + Math.random() * 4,
            vy: 2 + Math.random() * 3,
            life: 1,
            len: 60 + Math.random() * 80,
        });
        nextShootingStar = now + 6000 + Math.random() * 12000;
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += ss.vx;
        ss.y += ss.vy;
        ss.life -= 0.02;

        if (ss.life <= 0) { shootingStars.splice(i, 1); continue; }

        const tailX = ss.x - ss.vx * (ss.len / ss.vx);
        const tailY = ss.y - ss.vy * (ss.len / ss.vx);
        const grad = ctx.createLinearGradient(tailX, tailY, ss.x, ss.y);
        grad.addColorStop(0, `rgba(255, 255, 255, 0)`);
        grad.addColorStop(1, `rgba(255, 255, 255, ${ss.life * 0.7})`);
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(ss.x, ss.y);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Bright head
        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${ss.life})`;
        ctx.fill();
    }
}


// ============================================================
//  MAIN RENDER LOOP
// ============================================================

function frame() {
    requestAnimationFrame(frame);
    if (!tabVisible) return;

    // Advance sky transition
    if (skyLerp < 1) skyLerp = Math.min(1, skyLerp + 0.012);

    drawSky();
    drawCelestial();
    drawStars();
    drawShootingStars();
    drawClouds();
    drawRain();
    drawSnow();
    drawLightning();
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initStars(); }
window.addEventListener('resize', resize);
resize();
initClouds();
initRain();
initSnow();
frame();


// ============================================================
//  WEATHER API — Open-Meteo (no API key needed)
// ============================================================

const cityInput   = $('cityInput');
const searchForm  = $('searchForm');
const geoBtn      = $('geoBtn');
const statusMsg   = $('statusMsg');
const weatherGrid = $('weatherGrid');
const recentListEl = $('recentList');

function toUnit(c) { return unit === 'f' ? Math.round(c * 9/5 + 32) : Math.round(c); }
function unitLabel() { return unit === 'c' ? '\u00B0C' : '\u00B0F'; }

// Recent searches
function getRecent() { return JSON.parse(localStorage.getItem('wxRecent') || '[]'); }
function pushRecent(city) {
    let a = getRecent().filter(c => c.toLowerCase() !== city.toLowerCase());
    a.unshift(city); if (a.length > 5) a.pop();
    localStorage.setItem('wxRecent', JSON.stringify(a));
    renderRecent(a);
}
function renderRecent(arr) {
    recentListEl.innerHTML = '';
    if (!arr.length) { recentListEl.classList.add('hidden'); return; }
    arr.forEach(c => {
        const li = document.createElement('li');
        li.textContent = c;
        li.addEventListener('mousedown', () => { cityInput.value = c; recentListEl.classList.add('hidden'); fetchCity(c); });
        recentListEl.appendChild(li);
    });
}
cityInput.addEventListener('focus', () => { const a = getRecent(); if (a.length) { renderRecent(a); recentListEl.classList.remove('hidden'); } });
cityInput.addEventListener('blur', () => { setTimeout(() => recentListEl.classList.add('hidden'), 180); });

function showStatus(msg, type) { statusMsg.textContent = msg; statusMsg.className = `status-msg ${type}`; statusMsg.classList.remove('hidden'); }
function hideStatus() { statusMsg.classList.add('hidden'); }

searchForm.addEventListener('submit', e => { e.preventDefault(); const c = cityInput.value.trim(); if (c) { recentListEl.classList.add('hidden'); fetchCity(c); } });

geoBtn.addEventListener('click', () => {
    if (!navigator.geolocation) return alert('Geolocation not supported.');
    showStatus('Locating...', 'loading');
    navigator.geolocation.getCurrentPosition(
        async pos => {
            try {
                const { latitude: lat, longitude: lon } = pos.coords;
                const rev = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`).then(r => r.json());
                const city = rev.city || rev.locality || 'Unknown';
                cityInput.value = city;
                await fetchWeatherData(lat, lon, city, rev.countryCode);
            } catch { showStatus('Unable to fetch location.', 'error'); }
        },
        () => showStatus('Location permission denied.', 'error')
    );
});

async function fetchCity(city) {
    showStatus('Fetching weather...', 'loading');
    try {
        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`).then(r => r.json());
        if (!geo.results || !geo.results.length) throw new Error();
        const { latitude, longitude, name, country_code } = geo.results[0];
        pushRecent(name);
        await fetchWeatherData(latitude, longitude, name, country_code);
    } catch { showStatus('City not found. Check spelling.', 'error'); weatherGrid.classList.add('hidden'); }
}

async function fetchWeatherData(lat, lon, city, country) {
    try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,surface_pressure&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
        const data = await fetch(url).then(r => r.json());
        rawData = { city, country, current: data.current, hourly: data.hourly, daily: data.daily };
        render();
    } catch { showStatus('Failed to fetch weather data.', 'error'); }
}

function render() {
    if (!rawData) return;
    hideStatus();
    weatherGrid.classList.remove('hidden');
    const { city, country, current, hourly, daily } = rawData;
    const ul = unitLabel();

    $('cityName').textContent = `${city}, ${country || ''}`.replace(/, $/, '');
    $('bigTemp').textContent = toUnit(current.temperature_2m);
    $('bigUnit').innerHTML = `&deg;${unit.toUpperCase()}`;

    const cond = mapWeather(current.weather_code, current.is_day);
    $('condIcon').className = `fa-solid ${cond.icon}`;
    $('condText').textContent = cond.text;

    $('feelsLike').textContent = `${toUnit(current.apparent_temperature)}${ul}`;
    $('humidity').textContent = `${current.relative_humidity_2m}%`;
    $('wind').textContent = `${current.wind_speed_10m} km/h`;
    $('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

    // Update the sky and particles
    isDay = current.is_day;
    currentCondition = cond.theme;
    setSky(cond.theme, !!current.is_day);

    // Hourly
    const hEl = $('hourlyScroll'); hEl.innerHTML = '';
    const now = new Date();
    const idx = hourly.time.findIndex(t => new Date(t) > now) || 0;
    for (let i = idx; i < idx + 8; i++) {
        if (!hourly.time[i]) break;
        const t = new Date(hourly.time[i]).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const ic = mapWeather(hourly.weather_code[i], 1).icon;
        const div = document.createElement('div'); div.className = 'hourly-item';
        div.innerHTML = `<span class="hourly-time">${t}</span><i class="fa-solid ${ic} hourly-icon"></i><span class="hourly-temp">${toUnit(hourly.temperature_2m[i])}&deg;</span>`;
        hEl.appendChild(div);
    }

    // Daily
    const dEl = $('dailyList'); dEl.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
        if (!daily.time[i]) break;
        const day = new Date(daily.time[i]).toLocaleDateString('en-US', { weekday: 'long' });
        const ic = mapWeather(daily.weather_code[i], 1).icon;
        const row = document.createElement('div'); row.className = 'daily-row';
        row.innerHTML = `<span class="daily-day">${day}</span><i class="fa-solid ${ic} daily-icon"></i><div class="daily-temps"><span class="daily-hi">${toUnit(daily.temperature_2m_max[i])}&deg;</span><span class="daily-lo">${toUnit(daily.temperature_2m_min[i])}&deg;</span></div>`;
        dEl.appendChild(row);
    }
}

// Unit toggle
document.querySelectorAll('.unit-btn').forEach(btn => {
    btn.addEventListener('click', e => {
        const u = e.target.dataset.unit; if (u === unit) return;
        unit = u;
        document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        render();
    });
});

// WMO weather code mapping
function mapWeather(code, dayFlag) {
    let text = 'Clear sky', icon = dayFlag ? 'fa-sun' : 'fa-moon', theme = 'clear';
    if (code === 0) { /* defaults */ }
    else if (code <= 3) { text = code === 3 ? 'Overcast' : 'Partly cloudy'; icon = dayFlag ? 'fa-cloud-sun' : 'fa-cloud-moon'; if (code === 3) icon = 'fa-cloud'; theme = 'clouds'; }
    else if (code === 45 || code === 48) { text = 'Fog'; icon = 'fa-smog'; theme = 'clouds'; }
    else if (code >= 51 && code <= 67) { text = 'Rain'; icon = 'fa-cloud-rain'; theme = 'rain'; }
    else if (code >= 71 && code <= 77) { text = 'Snow'; icon = 'fa-snowflake'; theme = 'snow'; }
    else if (code >= 80 && code <= 82) { text = 'Showers'; icon = 'fa-cloud-showers-heavy'; theme = 'rain'; }
    else if (code >= 95) { text = 'Thunderstorm'; icon = 'fa-bolt'; theme = 'thunder'; }
    return { text, icon, theme };
}

document.addEventListener('DOMContentLoaded', () => renderRecent(getRecent()));
</script>
