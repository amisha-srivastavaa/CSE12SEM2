<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Tinted background block -->
    <div id="bgTint" class="bg-tint theme-default"></div>

    <nav class="minimal-nav">
        <a href="../index.html">← Back</a>
        <div class="nav-controls">
            <span class="unit-toggle" id="unitToggle">
                <span class="unit-btn active" data-unit="c">°C</span> | <span class="unit-btn" data-unit="f">°F</span>
            </span>
        </div>
    </nav>

    <div class="app-layout">
        
        <!-- Left Column: Search, Primary Weather & Forecast -->
        <aside class="layout-left">
            
            <div class="search-wrapper">
                <form id="searchForm" class="search-form">
                    <input type="text" id="cityInput" placeholder="Enter location..." autocomplete="off" required>
                    <button type="button" id="geoBtn" class="icon-btn" title="My Location"><i class="fas fa-location-crosshairs"></i></button>
                    <button type="submit" id="searchBtn" class="icon-btn"><i class="fas fa-arrow-right"></i></button>
                </form>
                
                <!-- Recent Searches Dropdown -->
                <ul id="recentSearches" class="recent-dropdown hidden"></ul>

                <div id="errorMessage" class="error-msg hidden">Location not found. Try again.</div>
            </div>

            <div id="statusMessage" class="status-box">
                Ready for query.
            </div>

            <div id="loadingIndicator" class="status-box hidden">
                Fetching records...
            </div>

            <!-- Primary Weather Data -->
            <div id="primaryWeather" class="primary-weather hidden">
                <div class="location-header">
                    <h1 id="cityName">San Francisco, US</h1>
                    <p id="weatherDescription" class="condition-label">Clear</p>
                </div>

                <div class="temperature-block">
                    <span id="temperature" class="huge-temp">22</span>
                    <span class="temp-unit" id="mainTempUnit">°C</span>
                    <i id="weatherIcon" class="fas fa-sun weather-icon-main"></i>
                </div>

                <!-- 5-Day Forecast -->
                <div class="forecast-section">
                    <span class="section-title">5-Day Forecast</span>
                    <div id="forecastRow" class="forecast-row">
                        <!-- Forecast items will be injected here -->
                    </div>
                </div>
            </div>

        </aside>

        <!-- Right Column: Staggered Secondary Details -->
        <main class="layout-right">
            
            <div id="secondaryWeather" class="secondary-metrics hidden">
                <!-- Staggered Layout for Details -->
                <div class="metric-card offset-1">
                    <span class="metric-title">Feels Like</span>
                    <div class="metric-data">
                        <span id="feelsLike">22</span><span class="temp-unit-small">°C</span>
                    </div>
                </div>

                <div class="metric-card offset-2">
                    <span class="metric-title">Relative Humidity</span>
                    <div class="metric-data">
                        <span id="humidity">45%</span>
                    </div>
                    <div class="metric-decorative-line"></div>
                </div>

                <div class="metric-card offset-3">
                    <span class="metric-title">Wind Velocity</span>
                    <div class="metric-data">
                        <span id="windSpeed">12 km/h</span>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
