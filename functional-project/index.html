<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard — Live Interactive Wallpaper</title>
    <meta name="description" content="A beautiful weather dashboard with interactive live weather wallpaper effects powered by HTML5 Canvas particle systems.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-clouds">

    <!-- Interactive Weather Wallpaper Canvas (z-index: 0) -->
    <canvas id="weatherCanvas"></canvas>

    <div class="app-container">
        
        <!-- Top Search Bar -->
        <header class="top-header">
            <a href="../index.html" class="back-link">← Back to Projects</a>
            <div class="search-wrapper">
                <form id="searchForm" class="search-form">
                    <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" required>
                    <button type="submit" id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
                </form>
                <ul id="recentSearches" class="recent-dropdown hidden"></ul>
                <div id="errorMessage" class="error-msg hidden">City not found. Check spelling.</div>
            </div>
            <div id="loadingIndicator" class="loading-msg hidden">Fetching data...</div>
        </header>

        <!-- Main Content Layout (Hidden until data is fetched) -->
        <div id="weatherContent" class="app-columns hidden">
            
            <!-- Left Column (40%) -->
            <aside class="left-col">
                <div class="location-row">
                    <h1 id="cityName">Delhi, IN</h1>
                    <button type="button" id="geoBtn" class="geo-btn" title="My Location"><i class="fas fa-location-crosshairs"></i></button>
                </div>
                
                <div class="condition-row">
                    <i id="weatherIcon" class="fas fa-cloud condition-icon"></i>
                    <span id="weatherDescription" class="condition-text">Partly Cloudy</span>
                </div>

                <div class="main-temp-wrapper">
                    <span id="temperature" class="main-temp">27</span>
                    <span class="main-unit" id="mainTempUnit">°C</span>
                </div>

                <div class="unit-toggle" id="unitToggle">
                    <button class="unit-btn active" data-unit="c">°C</button>
                    <button class="unit-btn" data-unit="f">°F</button>
                </div>

                <div class="metrics-grid">
                    <div class="metric-item">
                        <span class="metric-label">Feels like</span>
                        <span class="metric-val" id="feelsLike">29°C</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Humidity</span>
                        <span class="metric-val" id="humidity">65%</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Wind</span>
                        <span class="metric-val" id="windSpeed">14 km/h</span>
                    </div>
                </div>
            </aside>

            <!-- Right Column (60%) -->
            <main class="right-col">
                
                <section class="forecast-section">
                    <h3 class="section-title">Hourly Forecast</h3>
                    <div class="hourly-row" id="hourlyRow">
                        <!-- Hourly items injected here -->
                    </div>
                </section>

                <section class="forecast-section">
                    <h3 class="section-title">5-Day Forecast</h3>
                    <div class="daily-list" id="dailyList">
                        <!-- Daily items injected here -->
                    </div>
                </section>

            </main>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
