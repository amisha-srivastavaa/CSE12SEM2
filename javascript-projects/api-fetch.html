<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Fetcher</title>
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-cool">

    <div class="app-container">
        <!-- Navigation -->
        <nav class="project-nav">
            <a href="dom-manipulation.html">To-Do List</a>
            <a href="api-fetch.html" class="active">API Fetcher</a>
            <a href="../index.html" class="back-link">← Back to Home</a>
        </nav>

        <main class="content-box api-box">
            <header class="app-header">
                <h1>User Explorer</h1>
                <p>Fetching mock data from <a href="https://jsonplaceholder.typicode.com/" target="_blank">JSONPlaceholder</a></p>
            </header>

            <div class="controls text-center">
                <button id="fetchBtn" class="primary-btn"><i class="fas fa-cloud-download-alt"></i> Fetch Users Data</button>
                <button id="clearBtn" class="secondary-btn"><i class="fas fa-eraser"></i> Clear</button>
            </div>

            <div id="loader" class="loader hidden">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>

            <div id="errorBox" class="error-box hidden"></div>

            <div id="dataGrid" class="data-grid">
                <!-- User cards will be injected here -->
                <div class="placeholder-text">Click the fetch button to retrieve users.</div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fetchBtn = document.getElementById('fetchBtn');
            const clearBtn = document.getElementById('clearBtn');
            const dataGrid = document.getElementById('dataGrid');
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');

            fetchBtn.addEventListener('click', fetchUsers);
            clearBtn.addEventListener('click', clearData);

            async function fetchUsers() {
                // UI State Update
                dataGrid.innerHTML = '';
                errorBox.classList.add('hidden');
                loader.classList.remove('hidden');
                fetchBtn.disabled = true;

                try {
                    // Artificial delay to show loader (for presentation)
                    await new Promise(resolve => setTimeout(resolve, 800));

                    const response = await fetch('https://jsonplaceholder.typicode.com/users');
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const users = await response.json();
                    renderUsers(users);

                } catch (error) {
                    errorBox.textContent = `Error fetching data: ${error.message}`;
                    errorBox.classList.remove('hidden');
                } finally {
                    loader.classList.add('hidden');
                    fetchBtn.disabled = false;
                }
            }

            function renderUsers(users) {
                if (users.length === 0) {
                    dataGrid.innerHTML = '<div class="placeholder-text">No users found.</div>';
                    return;
                }

                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <div class="user-avatar">${user.name.charAt(0)}</div>
                        <h3 class="user-name">${escapeHtml(user.name)}</h3>
                        <p class="user-username">@${escapeHtml(user.username)}</p>
                        
                        <div class="user-details">
                            <p><i class="fas fa-envelope"></i> ${escapeHtml(user.email)}</p>
                            <p><i class="fas fa-globe"></i> <a href="http://${escapeHtml(user.website)}" target="_blank">${escapeHtml(user.website)}</a></p>
                            <p><i class="fas fa-map-marker-alt"></i> ${escapeHtml(user.address.city)}</p>
                        </div>
                    `;
                    dataGrid.appendChild(card);
                });
            }

            function clearData() {
                dataGrid.innerHTML = '<div class="placeholder-text">Data cleared. Click fetch to retrieve again.</div>';
                errorBox.classList.add('hidden');
            }

            // Utility to prevent XSS
            function escapeHtml(unsafe) {
                return unsafe.toString()
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }
        });
    </script>
</body>
</html>
